<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .container{
         height:100vh;
         width:100vw;
         display:grid;
         grid-template-columns:1fr 1fr 1fr;
         grid-template-rows: 1fr 1fr;
       }
       .box{
      
        color:antiquewhite;
        border:1px solid ;
        font-size:40px;
       }
       .box1{
        background-color:#3b3b58;
       }
       .box2{
        background-color:#434e2b;
       }
       
      
      .message{
    position: relative;
}
.code{
  position: relative;
}
.music{
  position: relative;
}
.dots{
  position: relative;
}
.ben10{
  position: relative;
}
.hacker{
  position: relative;
}
p{
    text-align: center;
    padding-top: 20px;
}

.load{
    
    position: absolute;
    top: 50%;
    left: 50%;  
}
.chat{
  position: absolute;
    top: 50%;
    left: 50%; 
width: 150px;
    height: 70px;

    background-color: rgb(223, 202, 174);
    border-radius: 50%;
   
}


    </style>
</head>
<body>
    <div class="container">
        <div class="box box1 message">
          <p>Message Loader</p>
          <div class="load chat">
              <span></span>
              <span></span>
              <span></span>
          </div>
        </div>
        <div class="box box2 code">
         <p>Code Loader</p>
          <div class="load block">
            <span>{</span>
            <span>}</span>
          </div>
        </div>
        <div class="box box1 music">
        <p>Music Loader</p>
          <div class="load volume">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
          </div>
        </div>
        <div class="box box2 dots">
        <p>Dots Loader</p>
          <div class="load dots3">
             <span></span>
             <span></span>
             <span></span>
          </div>
        </div>
        <div class="box box1 ben10">
        <p>BEN 10 Loader</p>
          <div class="load watch">
            
          </div>
        </div>
        <div class="box box2 hacker">
        <p>Hacker Loader</p>
          <div class="load hack">
            Loading
          </div>
        </div>
    </div>
</body>
</html>
