<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align:center;
            background:#d7c5a2;
            font-family:Georgia, 'Times New Roman', Times, serif;
        }
        h1{
            color:#634539;
            font-size:50px;
        }
        .subtitle{
            color:#634539;
            font-size:20px;
            font-weight:600;
        }
        .container{
            background:#996f3d;
            width:30%;
            margin:50px auto;
            border:3px solid rgb(238, 234, 234);
            border-radius:15px;
            padding:30px;
            
        }
        .card{
            width:400px;
            margin:40px auto;
            padding:30px;
            background:#d7c5a2 ;
            border-radius:15px; 
            border:3px solid whitesmoke
        }
        .card img{
            border-radius:15px;
        }
        .card h2{
            color:#5f3e31;
            font-weight:1000
        ;
        font-size:30px;
        margin:15px auto;
        }
        .card p{
            color:#5f3e31;
            font-weight:700;
            font-size:20px;
        }
        .card button{
            color:white;
            background-color:#996f3d;
            padding:12px 30px;
        }
    </style>
</head>
<body>
    <h1>
        Favourite Movies
    </h1>
    <p class="subtitle">Explore the best Indian Movies</p>
    <div class="container">
        <div class="card">
            <img src="assets/dhurandhar.jpg" width="320px" height="380px">
            <h2>
                Movie : Dhurandhar
            </h2>
            <p>Rating : 4.5/5 ⭐</p>
            <p>Year : 2026</p>
            <button>Read More</button>
        </div>
        <div class="card">
        
            <img src="assets/og.jpg" width="320px" height="380px">
            <h2>
                Movie : OG
            </h2>
            <p>Rating : 4/5 ⭐</p>
            <p>Year : 2026</p>
            <button>Read More</button>
        </div>
        <div class="card">
            <img src="assets/bahubali.jpg" width="320px" height="380px">
            <h2>
                Movie : bahubali
            </h2>
            <p>Rating : 4.5/5 ⭐</p>
            <p>Year : 2026</p>
            <button>Read More</button>
        </div>
    </div>
</body>
</html>
