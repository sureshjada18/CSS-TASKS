<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
           display:grid;
           grid-template-columns: repeat(4,1fr);
           grid-template-rows: repeat(11,1fr);
           height:100vh;
        }
        .box{
           font-size:25px;
           border:2px solid black;
           color:antiquewhite;
           display:flex;
              justify-content: center;
              align-items:center;
        }
        .header{

              background:rgb(49, 49, 130);
              grid-column: 1/5;
              display:flex;
              justify-content: center;
        }
        .navbar{
              background:rgb(117, 117, 243);
              grid-column: 1/5;
        }
        .sidebar{
              background:rgb(22, 22, 69);
        }
        .mainsection{
              background:rgb(6, 6, 138);
              grid-column:2/5;
        }
        .sidebar,.mainsection{
            grid-row:3/11;
        }
        .footer{
              background:rgb(74, 74, 109);
              grid-column:1/5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box header">Header</div>
        <div class="box navbar">Navbar</div>
        <div class="box sidebar">Sidebar</div>
        <div class="box mainsection">Main section</div>
        <div class="box footer">Footer</div>
    </div>
</body>
</html>
