<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color:rgb(170, 133, 84);
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            text-align:center;
        }
        #box{
          margin-top:20px
        }
        #signal{
          width:230px;
          background:rgb(36, 35, 35);
          margin:auto;
          padding:25px 0;
          border-radius:20px;
        }
        .light{
          width:170px;
          height:170px;
          border-radius:50%;
          margin:20px auto;
          border:4px solid rgb(170, 133, 84);
          color:rgb(170, 133, 84);
          font-weight:bold;
          font-size:16px;
          display:flex;
          align-items:center;
          text-align:center;
          padding:10px;
        }
        #red{
          background:red; 
        }
        #yellow{
          background:yellow;  
        }
        #green{
          background:green;  
        }
        #pole{
            background:rgb(36, 35, 35);
            width:25px;
            height:150px;
            margin:0 auto;
        }
        #name{
            background-color:rgb(114, 79, 54)
        }
        h1{
            margin-top:30px;
        }
        p{
            color:white;
        }
    </style>
</head>
<body>
    <div id="box">
        <div id="signal">
            <div class="light" id="red">
                 STOP PROCASTINATION
            </div>
            <div class="light" id="yellow">
                 GET READY TO LEARN
            </div>
            <div class="light" id="green">
                 START YOUR TECH JOURNEY
            </div>
        </div>
        <div id="pole"></div>
    </div>
    <div id="name"><h1>FULL STACK EXPERTS ACADEMY</h1></div>
    <p>Learn • Build • Grow </p>
</body>
</html>
